name: Zakázky z Vhodného uveřejnění

# Přečte RSS nových zakázek na vhodne-uverejneni.cz a doplní detaily (zadavatel, lhůta), 30 s mezi dotazy.
# Servery GitHubu se k nim nepřipojí (blokují je), proto se scripts/vhodne.mjs pouští z Macu; tady jen ručně
# pro případ, že blokaci zruší.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vhodne:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/vhodne.mjs
        env:
          BUDGET_MIN: "50"
      - name: Uložit výsledky
        if: always()
        run: |
          git config user.name "xxmark83"
          git config user.email "142055462+xxmark83@users.noreply.github.com"
          git add data/vhodne.json
          git diff --cached --quiet || git commit -m "Zakázky z Vhodného uveřejnění $(date -u +%F)"
          git pull --rebase -q
          git push
