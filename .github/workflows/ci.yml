name: Kontrola kódu

# Typy, testy obchodních pravidel (tests/) a produkční build při každé změně kódu.
# Sběr dat (data/**) kontrolu nespouští.
on:
  pull_request:
    paths-ignore: ["data/**", "**.md", "guide/**"]
  push:
    branches: [main]
    paths-ignore: ["data/**", "**.md", "guide/**"]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
