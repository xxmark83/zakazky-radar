name: Výsledky zakázek z otevřených dat ISVZ

# ISVZ zveřejňuje data jednou měsíčně (5. den). Server isvz.nipez.cz ale z GitHubu (datacentra) neodpovídá,
# takže se data zatím stahují z běžného počítače: node scripts/isvz.mjs a commit. Workflow zůstává
# pro ruční spuštění, kdyby se přístup otevřel.
on:
  workflow_dispatch:
    inputs:
      from:
        description: "Od měsíce (RRRR-MM), prázdné = minulý měsíc"
        required: false
      to:
        description: "Do měsíce (RRRR-MM)"
        required: false

permissions:
  contents: write

jobs:
  isvz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/isvz.mjs ${{ inputs.from }} ${{ inputs.to }}
      - name: Uložit výsledky
        run: |
          git config user.name "xxmark83"
          git config user.email "142055462+xxmark83@users.noreply.github.com"
          git add data/isvz-vysledky.json data/isvz-dns.json
          git diff --cached --quiet || git commit -m "Výsledky zakázek z ISVZ $(date -u +%F)"
          git pull --rebase -q
          git push
