name: Výsledky zakázek z otevřených dat ISVZ

# ISVZ zveřejňuje data jednou měsíčně (5. den). Šestého ráno stáhneme minulý měsíc a přidáme ho
# do data/isvz-vysledky.json (jen smlouvy z IT, softwaru a vzdělávání). Ručně jde stáhnout i rozsah měsíců.
on:
  schedule:
    - cron: "41 4 6 * *"
  workflow_dispatch:
    inputs:
      from:
        description: "Od měsíce (RRRR-MM), prázdné = minulý měsíc"
        required: false
      to:
        description: "Do měsíce (RRRR-MM)"
        required: false

permissions:
  contents: write

concurrency: data-commit

jobs:
  isvz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/isvz.mjs ${{ inputs.from }} ${{ inputs.to }}
      - name: Uložit výsledky
        run: |
          git config user.name "xxmark83"
          git config user.email "142055462+xxmark83@users.noreply.github.com"
          git add data/isvz-vysledky.json data/isvz-dns.json
          git diff --cached --quiet || git commit -m "Výsledky zakázek z ISVZ $(date -u +%F)"
          git pull --rebase -q
          git push
