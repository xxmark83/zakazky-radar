name: Sběr zakázek z profilů zadavatelů

# Každé ráno projde profily zadavatelů v ČR a uloží otevřené zakázky do data/profily.json.
# Repo je veřejné, takže Actions nemají limit minut – běh smí trvat až 5 hodin. Pomalé servery (Tender arena
# pustí asi 5 dotazů za minutu) se střídají po dnech, data/profily-stav.json pamatuje, kde skončil.
# Startuje večer ve 22:17 UTC, aby skončil před ranním e-mailem (Vercel Cron v 5:00 UTC). Commit spustí nasazení.
on:
  schedule:
    - cron: "17 22 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Plný sběr (120 dní)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: data-commit

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/crawl.mjs ${{ inputs.full && '--full' || '' }}
        env:
          BUDGET_MIN: 300
      - name: Uložit výsledky
        run: |
          git config user.name "xxmark83"
          git config user.email "142055462+xxmark83@users.noreply.github.com"
          git add data/profily.json data/profily-stav.json
          git diff --cached --quiet || git commit -m "Zakázky z profilů zadavatelů $(date -u +%F)"
          # během sběru mohl přibýt jiný commit (nová verze appky) – data na něj jen naskládat
          git pull --rebase -q
          git push
